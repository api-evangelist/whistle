apis:
  - aid: whistle:whistle
    name: Whistle
    description: >-
      Whistle is a cross-platform HTTP, HTTPS, HTTP/2, WebSocket, and TCP debugging
      proxy tool. It lets developers intercept, inspect, and modify network traffic
      using a rule-based configuration system. Features include request/response
      modification, local file mapping, API mocking, remote debugging with Weinre,
      request replay via a built-in Composer, plugin support, and a web-based UI.
    humanURL: https://wproxy.org/whistle/
    baseURL: http://localhost:8899
    tags:
      - Debugging Proxy
      - Proxy
      - Network Debugging
      - HTTP
      - HTTPS
      - WebSocket
      - Developer Tools
      - API Mocking
      - Request Replay
